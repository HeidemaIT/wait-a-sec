name: Learn from Silence — Android CI

on:
  push:
    branches: [main, master]
    paths:
      - 'apps/learn-from-silence/android/**'
      - '.github/workflows/learn-from-silence-android-ci.yml'
  pull_request:
    branches: [main, master]
    paths:
      - 'apps/learn-from-silence/android/**'
      - '.github/workflows/learn-from-silence-android-ci.yml'

jobs:
  build:
    runs-on: ubuntu-latest

    defaults:
      run:
        working-directory: apps/learn-from-silence/android

    steps:
      - name: Checkout
        uses: actions/checkout@v6

      - name: Set up JDK 17
        uses: actions/setup-java@v5
        with:
          distribution: temurin
          java-version: 17

      - name: Set up Android SDK
        uses: android-actions/setup-android@v4

      - name: Install Android SDK packages
        run: |
          sdkmanager "platforms;android-35" "platforms;android-37.0" "build-tools;36.0.0"

      - name: Grant execute permission for Gradle wrapper
        run: chmod +x gradlew

      - name: Build debug APK
        run: ./gradlew assembleDebug --stacktrace

      - name: Upload debug APK
        uses: actions/upload-artifact@v5
        with:
          name: learn-from-silence-debug
          path: apps/learn-from-silence/android/app/build/outputs/apk/debug/app-debug.apk
          if-no-files-found: error
          retention-days: 14
